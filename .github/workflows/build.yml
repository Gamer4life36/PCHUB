name: Build

# Builds PCHUB for Windows, macOS and Linux on every push and pull request.
# Pushing a tag like v0.2.0 also publishes the downloads as a GitHub Release.

on:
  push:
    branches: [main, cross-platform]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PROJECT: src/PcHub/PcHub.csproj

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (Windows x64, single file)
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/win-x64

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.txt out/win-x64/
          Compress-Archive -Path out/win-x64/PCHUB.exe, out/win-x64/README.txt -DestinationPath PCHUB-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PCHUB-win-x64
          path: PCHUB-win-x64.zip

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishReadyToRun=false -o out/${{ matrix.rid }}

      - name: Make PCHUB.app
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ${{ env.PROJECT }} | head -1)
          APP=PCHUB.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R out/${{ matrix.rid }}/. "$APP/Contents/MacOS/"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp packaging/macos/PCHUB.icns "$APP/Contents/Resources/PCHUB.icns"
          chmod +x "$APP/Contents/MacOS/PCHUB"
          # Ad-hoc signature: required for apps to run on Apple Silicon. Not notarized (needs an Apple Developer account).
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Smoke test (Apple Silicon build on this Mac)
        if: matrix.rid == 'osx-arm64'
        run: |
          set -uo pipefail
          DATA="$HOME/Library/Application Support/PCHUB"
          ./PCHUB.app/Contents/MacOS/PCHUB > smoke.log 2>&1 &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then
            echo "PCHUB started and is still running after 25 s."
            STATUS=0
            # A second launch must hand its request to the running copy and exit, not open another window.
            ./PCHUB.app/Contents/MacOS/PCHUB --open http://127.0.0.1:1/ > second.log 2>&1 &
            SECOND=$!
            sleep 10
            if kill -0 $SECOND 2>/dev/null; then echo "Second launch didn't hand off:"; cat second.log; kill $SECOND; STATUS=1
            else echo "Second launch handed off and exited."; fi
            kill -0 $PID 2>/dev/null || { echo "First copy died after the hand-off:"; cat smoke.log; STATUS=1; }
            kill $PID; wait $PID 2>/dev/null || true
          else
            echo "PCHUB exited early:"; cat smoke.log
            STATUS=1
          fi
          if [ -f "$DATA/crash.log" ]; then echo "crash.log:"; cat "$DATA/crash.log"; STATUS=1; fi
          if [ -f "$DATA/activity.jsonl" ]; then echo "History:"; cat "$DATA/activity.jsonl"; fi
          exit $STATUS

      - name: Zip
        run: ditto -c -k --keepParent PCHUB.app PCHUB-${{ matrix.rid == 'osx-arm64' && 'macos-apple-silicon' || 'macos-intel' }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PCHUB-${{ matrix.rid }}
          path: PCHUB-*.zip

  linux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r ${{ matrix.rid }} --self-contained true
          -o out/PCHUB

      - name: Package
        run: |
          set -euo pipefail
          cp packaging/linux/install.sh packaging/linux/pchub.png packaging/linux/README.txt out/PCHUB/
          chmod +x out/PCHUB/PCHUB out/PCHUB/install.sh
          tar -C out -czf PCHUB-${{ matrix.rid }}.tar.gz PCHUB

      - name: Smoke test (virtual screen)
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libwebkit2gtk-4.1-0 libice6 libsm6 libfontconfig1 > /dev/null
          DATA="$HOME/.local/share/PCHUB"
          xvfb-run -a -s "-screen 0 1440x900x24" sh -c '
            ./out/PCHUB/PCHUB > smoke.log 2>&1 &
            PID=$!
            sleep 25
            if ! kill -0 $PID 2>/dev/null; then echo "PCHUB exited early:"; cat smoke.log; exit 1; fi
            echo "PCHUB started and is still running after 25 s."
            ./out/PCHUB/PCHUB --open http://127.0.0.1:1/ > second.log 2>&1 &
            SECOND=$!
            sleep 10
            if kill -0 $SECOND 2>/dev/null; then echo "Second launch did not hand off:"; cat second.log; kill $SECOND; exit 1; fi
            echo "Second launch handed off and exited."
            kill -0 $PID 2>/dev/null || { echo "First copy died after the hand-off:"; cat smoke.log; exit 1; }
            kill $PID
          '
          STATUS=$?
          if [ -f "$DATA/crash.log" ]; then echo "crash.log:"; cat "$DATA/crash.log"; STATUS=1; fi
          if [ -f "$DATA/activity.jsonl" ]; then echo "History:"; cat "$DATA/activity.jsonl"; fi
          exit $STATUS

      - uses: actions/upload-artifact@v4
        with:
          name: PCHUB-${{ matrix.rid }}
          path: PCHUB-${{ matrix.rid }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version in the project
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ${{ env.PROJECT }} | head -1)
          [ "v$VERSION" = "${{ github.ref_name }}" ] || { echo "Tag ${{ github.ref_name }} doesn't match <Version>$VERSION</Version>"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt --repo "${{ github.repository }}" --title "PCHUB ${{ github.ref_name }}" --generate-notes
